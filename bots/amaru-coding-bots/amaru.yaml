# Daemon settings for the amaru-coding-bots coding bot. GH_TOKEN holds
# orp-bot's token.
state_dir: /home/mini-amaru/amaru   # inside the home volume, next to the Codex login
poll_interval: 60s
max_parallel: 1
gh: gh
bot_login: orp-bot
web:
  listen: 0.0.0.0:8765

agents:
  codex:
    driver: codex
    command: codex
    # The container is the sandbox, and the bot clones the target project
    # to inspect it, so Codex runs without approvals and without its own
    # sandbox.
    args: [--dangerously-bypass-approvals-and-sandbox]
    # The AI Agents OSS Helper plugin, installed into the home volume at
    # every start (each step is safe to repeat).
    setup:
      - [plugin, marketplace, add, Open-Harness-Engineering/ai-agents-oss-helper]
      - [plugin, add, oss-helper@ai-agents-oss-helper]
  # Every bot image has Claude Code too. To use it, set `agent: claude`
  # in project.yaml.
  claude:
    driver: claude
    command: claude
    args: [--permission-mode, bypassPermissions]
    setup:
      - [plugin, marketplace, add, Open-Harness-Engineering/ai-agents-oss-helper]
      - [plugin, install, oss-helper@ai-agents-oss-helper]

projects:
  - project.yaml
