# Daemon settings for the midnight-saci coding bot. GH_TOKEN holds
# orp-bot's token.
state_dir: /home/mini-amaru/amaru   # inside the home volume, next to the agent logins
poll_interval: 60s
max_parallel: 1
gh: gh
bot_login: orp-bot

web:
  listen: 0.0.0.0:8765

agents:
  codex:
    driver: codex
    command: codex
    # The container is the sandbox, so Codex runs without approvals and can
    # reach the network for the build.
    args: [--dangerously-bypass-approvals-and-sandbox]
    # The AI Agents OSS Helper plugin, installed into the home volume at
    # every start (each step is safe to repeat).
    setup:
      - [plugin, marketplace, add, Open-Harness-Engineering/ai-agents-oss-helper]
      - [plugin, add, oss-helper@ai-agents-oss-helper]
  # Install it on the web interface's Agents page, then set
  # `agent: claude` in project.yaml to use it.
  claude:
    driver: claude
    command: claude
    args: [--permission-mode, bypassPermissions]
    setup:
      - [plugin, marketplace, add, Open-Harness-Engineering/ai-agents-oss-helper]
      - [plugin, install, oss-helper@ai-agents-oss-helper]
  # IBM Bob: install it on the Agents page (that accepts IBM's license),
  # run the container with your own key as -e BOB_API_KEY, then set
  # `agent: bob` in project.yaml to use it.
  bob:
    driver: bob
    command: bob
    args: [--accept-license]

projects:
  - project.yaml
