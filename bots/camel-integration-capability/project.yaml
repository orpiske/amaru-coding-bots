repo: wanaku-ai/camel-integration-capability
base_branch: main
fork: orp-bot/camel-integration-capability
branch_prefix: feat/

intake:
  labels: [needs-implementation]

agent: codex
step_timeout: 45m

checks:
  - name: maven-install
    run: mvn -B install --file pom.xml
    timeout: 30m
max_fix_rounds: 3

review:
  self: same_agent
  respond: true
  reviewers: [orpiske]
  max_rounds: 5
  fix_ci: true

workspace:
  keep_blocked: 7d
