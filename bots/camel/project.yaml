repo: apache/camel
base_branch: main
fork: orp-bot/camel
branch_prefix: feat/

intake:
  labels: [needs-implementation]

jira:
  url: https://issues.apache.org/jira
  project: CAMEL
  comment: false

agent: claude
step_timeout: 45m

checks:
  - name: camel-core
    run: ./mvnw -B -ntp -pl core/camel-core -am -DskipITs install
    timeout: 60m
max_fix_rounds: 3

review:
  self: same_agent
  respond: true
  reviewers: [orpiske]
  max_rounds: 5
  fix_ci: true

workspace:
  keep_blocked: 7d
